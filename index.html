<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Yalmil.com</title>

<link rel="icon" href="https://cdn.discordapp.com/emojis/1416607460201857168.png?v=1" type="image/png">
</head>
<body>

<button id="loginBtn">Iniciar sesión con Google</button>
<div id="message"></div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBxOsWfP64cAUsMK6XPwfUcrEI6xQF_lc4",
  authDomain: "yarep-ydturl.firebaseapp.com",
  databaseURL: "https://yarep-ydturl-default-rtdb.firebaseio.com",
  projectId: "yarep-ydturl",
  storageBucket: "yarep-ydturl.firebasestorage.app",
  messagingSenderId: "765100698390",
  appId: "1:765100698390:web:7db4490c174dac46253e37",
  measurementId: "G-HVR79VWSYZ"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

const loginBtn = document.getElementById("loginBtn");
const message = document.getElementById("message");

loginBtn.addEventListener("click", async () => {
  try {
    const result = await signInWithPopup(auth, provider);
    const user = result.user;
    message.textContent = `Success, ${user.displayName}`;
  } catch (error) {
    message.textContent = "Error al iniciar sesión";
    console.error(error);
  }
});
</script>

</body>
</html>
