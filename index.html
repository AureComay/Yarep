<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yarep</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: 'Inter', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 30px 20px;
    gap: 25px;
    animation: fadeIn 0.5s ease;
    transition: background-color 0.3s, color 0.3s;
}

/* Temas */
body.light-theme {
    background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
    color: #333333;
}

body.dark-theme {
    background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
    color: #ffffff;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

.container {
    max-width: 600px;
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 25px;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    margin-bottom: 10px;
    gap: 10px;
    flex-wrap: wrap;
}

.logo {
    font-size: 28px;
    font-weight: 700;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

.header-buttons {
    display: flex;
    gap: 10px;
    align-items: center;
}

.settings-btn {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.2);
    color: inherit;
    padding: 8px 16px;
    border-radius: 30px;
    font-size: 20px;
    cursor: pointer;
    transition: all 0.3s ease;
}

.settings-btn:hover {
    background: rgba(255,255,255,0.1);
    transform: translateY(-2px);
}

textarea, input {
    padding: 12px 16px;
    border-radius: 12px;
    border: 2px solid transparent;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    transition: all 0.3s ease;
    width: 100%;
    outline: none;
}

body.light-theme textarea,
body.light-theme input {
    background: white;
    color: #333333;
    border-color: #e0e0e0;
}

body.dark-theme textarea,
body.dark-theme input {
    background: rgba(255,255,255,0.05);
    color: #ffffff;
    border-color: rgba(255,255,255,0.1);
}

textarea:focus, input:focus {
    border-color: #667eea !important;
}

button {
    padding: 10px 20px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    font-weight: 600;
    font-size: 14px;
    transition: all 0.3s ease;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 20px rgba(0,0,0,0.1);
}

button:active {
    transform: translateY(0);
}

#loginBtn {
    background: white;
    color: #333;
    border: 2px solid #e0e0e0;
}

body.dark-theme #loginBtn {
    background: rgba(255,255,255,0.1);
    color: white;
    border-color: rgba(255,255,255,0.2);
}

#userArea {
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(10px);
    border-radius: 16px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 15px;
    border: 1px solid rgba(255,255,255,0.2);
}

.post {
    width: 100%;
    padding: 20px;
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    gap: 15px;
    animation: fadeIn 0.3s ease;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.2);
}

body.light-theme .post {
    background: rgba(255,255,255,0.7);
    border-color: rgba(0,0,0,0.1);
}

body.dark-theme .post {
    background: rgba(255,255,255,0.03);
}

.post:hover {
    transform: translateY(-2px);
    box-shadow: 0 15px 30px rgba(0,0,0,0.2);
}

.post-header {
    display: flex;
    gap: 12px;
    align-items: center;
    cursor: pointer;
    padding: 5px;
    border-radius: 30px;
    transition: background-color 0.3s ease;
}

.post-header:hover {
    background: rgba(255,255,255,0.1);
}

.post-header img {
    width: 45px;
    height: 45px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid #667eea;
}

.post-message {
    font-size: 15px;
    line-height: 1.6;
    padding: 10px 0;
}

.post-actions {
    display: flex;
    gap: 15px;
    border-top: 1px solid rgba(255,255,255,0.1);
    padding-top: 15px;
}

.action-btn {
    background: transparent;
    color: inherit;
    padding: 8px 16px;
    border-radius: 30px;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    border: 1px solid rgba(255,255,255,0.2);
}

.action-btn:hover {
    background: rgba(255,255,255,0.1);
    transform: none;
    box-shadow: none;
}

.action-btn.liked {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    border-color: transparent;
}

.comments-section {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 10px;
}

.comment-input {
    display: flex;
    gap: 10px;
    align-items: center;
}

.comment-input input {
    flex: 1;
    padding: 10px 14px;
    font-size: 13px;
}

.comment {
    font-size: 13px;
    padding: 10px 14px;
    border-radius: 12px;
    background: rgba(255,255,255,0.05);
    line-height: 1.5;
}

body.light-theme .comment {
    background: rgba(0,0,0,0.03);
}

.comment strong {
    color: #667eea;
    font-weight: 600;
}

/* Modal de perfil */
.profile-modal,
.settings-modal {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0,0,0,0.8);
    backdrop-filter: blur(10px);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 1000;
    animation: fadeIn 0.3s ease;
}

.profile-content,
.settings-content {
    background: rgba(30,30,40,0.95);
    border-radius: 24px;
    padding: 30px;
    max-width: 400px;
    width: 90%;
    position: relative;
    border: 1px solid rgba(255,255,255,0.2);
    max-height: 80vh;
    overflow-y: auto;
}

body.light-theme .profile-content,
body.light-theme .settings-content {
    background: rgba(255,255,255,0.95);
    color: #333;
}

.close-btn {
    position: absolute;
    top: 15px;
    right: 15px;
    background: rgba(255,255,255,0.1);
    border: none;
    font-size: 20px;
    cursor: pointer;
    color: white;
    width: 35px;
    height: 35px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
}

body.light-theme .close-btn {
    color: #333;
    background: rgba(0,0,0,0.1);
}

.close-btn:hover {
    background: rgba(255,255,255,0.2);
}

.profile-header {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
    margin-bottom: 25px;
}

.profile-header img {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    border: 3px solid #667eea;
    object-fit: cover;
    cursor: pointer;
    transition: transform 0.3s ease;
}

.profile-header img:hover {
    transform: scale(1.05);
}

.profile-stats {
    display: flex;
    justify-content: space-around;
    width: 100%;
    margin: 20px 0;
    padding: 15px 0;
    border-top: 1px solid rgba(255,255,255,0.1);
    border-bottom: 1px solid rgba(255,255,255,0.1);
}

.stat {
    text-align: center;
}

.stat-value {
    font-size: 20px;
    font-weight: 700;
    color: #667eea;
}

.stat-label {
    font-size: 12px;
    opacity: 0.7;
}

.user-profile-btn {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.2);
    color: inherit;
    padding: 8px 16px;
    border-radius: 30px;
    font-size: 14px;
}

.user-profile-btn:hover {
    background: rgba(255,255,255,0.1);
}

/* Estilos para ajustes */
.settings-section {
    margin-bottom: 30px;
}

.settings-section h3 {
    margin-bottom: 20px;
    color: #667eea;
}

.theme-options {
    display: flex;
    gap: 15px;
    justify-content: center;
    margin-bottom: 20px;
}

.theme-option {
    flex: 1;
    padding: 15px;
    border-radius: 12px;
    border: 2px solid transparent;
    cursor: pointer;
    text-align: center;
    transition: all 0.3s ease;
}

.theme-option.light {
    background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
    color: #333;
}

.theme-option.dark {
    background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
    color: white;
}

.theme-option.selected {
    border-color: #667eea;
    transform: scale(1.05);
}

.edit-field {
    margin-bottom: 20px;
}

.edit-field label {
    display: block;
    margin-bottom: 8px;
    font-weight: 500;
}

.edit-field input {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    color: inherit;
}

.edit-field input:focus {
    border-color: #667eea;
}

.photo-upload {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
    margin-bottom: 20px;
}

.photo-preview {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    border: 3px solid #667eea;
    object-fit: cover;
    cursor: pointer;
}

.photo-upload input[type="file"] {
    display: none;
}

.photo-upload-btn {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    color: inherit;
    padding: 8px 16px;
    border-radius: 30px;
    cursor: pointer;
    transition: all 0.3s ease;
}

.photo-upload-btn:hover {
    background: rgba(255,255,255,0.2);
}

.save-btn {
    width: 100%;
    margin-top: 20px;
}
</style>
</head>
<body class="dark-theme">
<div class="container">
    <div class="header">
        <span class="logo">Yarep</span>
        <div class="header-buttons">
            <button id="settingsBtn" class="settings-btn" title="Ajustes">⚙️</button>
            <button id="loginBtn" class="user-profile-btn">
                <span>👤</span> Iniciar sesión
            </button>
        </div>
    </div>

    <div id="userArea" style="display:none;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h3>Crear publicación</h3>
            <button id="profileBtn" class="user-profile-btn">
                <span>👤</span> Mi perfil
            </button>
        </div>
        <textarea id="postInput" placeholder="¿Qué estás pensando?"></textarea>
        <button id="postBtn">Publicar</button>
    </div>

    <div id="posts"></div>
</div>

<!-- Modal de perfil -->
<div id="profileModal" class="profile-modal">
    <div class="profile-content">
        <button class="close-btn" id="closeProfile">&times;</button>
        <div id="profileContent"></div>
    </div>
</div>

<!-- Modal de ajustes -->
<div id="settingsModal" class="settings-modal">
    <div class="settings-content">
        <button class="close-btn" id="closeSettings">&times;</button>
        <h2 style="text-align: center; margin-bottom: 25px; color: #667eea;">Ajustes</h2>
        
        <div class="settings-section">
            <h3>Tema</h3>
            <div class="theme-options">
                <div class="theme-option light" onclick="setTheme('light')">
                    <div style="font-size: 24px; margin-bottom: 10px;">☀️</div>
                    <div>Claro</div>
                </div>
                <div class="theme-option dark" onclick="setTheme('dark')">
                    <div style="font-size: 24px; margin-bottom: 10px;">🌙</div>
                    <div>Oscuro</div>
                </div>
            </div>
        </div>

        <div class="settings-section" id="profileSettings" style="display: none;">
            <h3>Editar Perfil</h3>
            <div class="photo-upload">
                <img id="photoPreview" src="" alt="Foto de perfil" class="photo-preview" onclick="document.getElementById('photoInput').click()">
                <input type="file" id="photoInput" accept="image/*" onchange="previewPhoto(this)">
                <label for="photoInput" class="photo-upload-btn">📷 Cambiar foto</label>
            </div>
            
            <div class="edit-field">
                <label>Nombre</label>
                <input type="text" id="displayNameInput" placeholder="Tu nombre">
            </div>

            <button class="save-btn" onclick="saveProfileChanges()">Guardar cambios</button>
        </div>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, setPersistence, browserLocalPersistence, signOut, updateProfile } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getDatabase, ref, set, push, onValue, update, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
import { getStorage, ref as storageRef, uploadString, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

const firebaseConfig = {
    apiKey: "AIzaSyBxOsWfP64cAUsMK6XPwfUcrEI6xQF_lc4",
    authDomain: "yarep-ydturl.firebaseapp.com",
    databaseURL: "https://yarep-ydturl-default-rtdb.firebaseio.com",
    projectId: "yarep-ydturl",
    storageBucket: "yarep-ydturl.firebasestorage.app",
    messagingSenderId: "765100698390",
    appId: "1:765100698390:web:7db4490c174dac46253e37"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);
const storage = getStorage(app);
const provider = new GoogleAuthProvider();

await setPersistence(auth, browserLocalPersistence);

const loginBtn = document.getElementById("loginBtn");
const userArea = document.getElementById("userArea");
const postBtn = document.getElementById("postBtn");
const postInput = document.getElementById("postInput");
const postsDiv = document.getElementById("posts");
const profileBtn = document.getElementById("profileBtn");
const profileModal = document.getElementById("profileModal");
const profileContent = document.getElementById("profileContent");
const closeProfile = document.getElementById("closeProfile");
const settingsBtn = document.getElementById("settingsBtn");
const settingsModal = document.getElementById("settingsModal");
const closeSettings = document.getElementById("closeSettings");
const profileSettings = document.getElementById("profileSettings");
const photoPreview = document.getElementById("photoPreview");
const displayNameInput = document.getElementById("displayNameInput");
const photoInput = document.getElementById("photoInput");

let currentUser = null;
let userLikes = {};

// Tema
function setTheme(theme) {
    document.body.className = theme + '-theme';
    localStorage.setItem('theme', theme);
    
    // Actualizar selección visual
    document.querySelectorAll('.theme-option').forEach(opt => {
        opt.classList.remove('selected');
    });
    document.querySelector('.theme-option.' + theme).classList.add('selected');
}
window.setTheme = setTheme;

// Cargar tema guardado
const savedTheme = localStorage.getItem('theme') || 'dark';
setTheme(savedTheme);

// Cargar likes del usuario
async function loadUserLikes(userId) {
    const likesRef = ref(db, `userLikes/${userId}`);
    const snapshot = await get(likesRef);
    if (snapshot.exists()) {
        userLikes = snapshot.val() || {};
    }
}

// Guardar like
async function saveUserLike(userId, postId) {
    userLikes[postId] = true;
    await set(ref(db, `userLikes/${userId}`), userLikes);
}

// Quitar like
async function removeUserLike(userId, postId) {
    delete userLikes[postId];
    await set(ref(db, `userLikes/${userId}`), userLikes);
}

loginBtn.onclick = async () => {
    try {
        await signInWithPopup(auth, provider);
    } catch (error) {
        console.error("Error al iniciar sesión:", error);
    }
};

onAuthStateChanged(auth, async user => {
    if (user) {
        currentUser = user;
        loginBtn.innerHTML = '<span>👤</span> ' + user.displayName.split(' ')[0];
        userArea.style.display = "block";
        profileSettings.style.display = "block";
        
        await loadUserLikes(user.uid);
        
        // Actualizar datos en la base de datos (sin email)
        set(ref(db, "users/" + user.uid), {
            name: user.displayName,
            photo: user.photoURL
        });
        
        // Cargar datos actuales en el modal de ajustes
        displayNameInput.value = user.displayName || '';
        photoPreview.src = user.photoURL || 'https://via.placeholder.com/100';
    } else {
        currentUser = null;
        loginBtn.innerHTML = '<span>👤</span> Iniciar sesión';
        userArea.style.display = "none";
        profileSettings.style.display = "none";
        userLikes = {};
    }
});

postBtn.onclick = () => {
    const user = auth.currentUser;
    if (!user || !postInput.value.trim()) return;

    push(ref(db, "posts"), {
        uid: user.uid,
        name: user.displayName,
        photo: user.photoURL,
        message: postInput.value,
        likes: 0,
        likesCount: 0,
        comments: {},
        date: Date.now()
    });

    postInput.value = "";
};

onValue(ref(db, "posts"), snapshot => {
    postsDiv.innerHTML = "";
    const data = snapshot.val();
    if (!data) return;

    Object.entries(data).reverse().forEach(([id, post]) => {
        const commentsHTML = post.comments ? Object.entries(post.comments).map(([commentId, comment]) => `
            <div class="comment" key="${commentId}">
                <strong>${comment.name}:</strong> ${comment.text}
            </div>
        `).join("") : "";

        const hasLiked = currentUser && userLikes[id];
        const likesCount = post.likesCount || post.likes || 0;

        postsDiv.innerHTML += `
        <div class="post" data-post-id="${id}">
            <div class="post-header" onclick="showProfile('${post.uid}')">
                <img src="${post.photo}" alt="${post.name}">
                <strong>${post.name}</strong>
            </div>
            <div class="post-message">${post.message}</div>
            <div class="post-actions">
                <button class="action-btn ${hasLiked ? 'liked' : ''}" onclick="handleLike('${id}')">
                    <span>❤️</span> ${likesCount}
                </button>
                <button class="action-btn" onclick="focusComment('${id}')">
                    <span>💬</span> Comentar
                </button>
            </div>
            <div class="comments-section" id="comments-${id}">
                <div class="comment-input">
                    <input type="text" placeholder="Escribe un comentario..." id="comment-input-${id}" onkeydown="if(event.key==='Enter')handleComment('${id}', this)">
                    <button onclick="handleComment('${id}', document.getElementById('comment-input-${id}'))">Enviar</button>
                </div>
                <div class="comments-list">
                    ${commentsHTML}
                </div>
            </div>
        </div>
        `;
    });
});

window.handleLike = async (postId) => {
    if (!currentUser) {
        alert("Debes iniciar sesión para dar like");
        return;
    }

    const postRef = ref(db, "posts/" + postId);
    const snapshot = await get(postRef);
    const post = snapshot.val();
    
    if (!post) return;

    const hasLiked = userLikes[postId];
    const currentLikes = post.likesCount || post.likes || 0;

    if (hasLiked) {
        await update(postRef, {
            likesCount: currentLikes - 1
        });
        await removeUserLike(currentUser.uid, postId);
    } else {
        await update(postRef, {
            likesCount: currentLikes + 1
        });
        await saveUserLike(currentUser.uid, postId);
    }
};

window.handleComment = async (postId, input) => {
    const user = auth.currentUser;
    if (!user || !input.value.trim()) return;

    await push(ref(db, "posts/" + postId + "/comments"), {
        name: user.displayName,
        text: input.value,
        uid: user.uid,
        date: Date.now()
    });

    input.value = "";
};

window.focusComment = (postId) => {
    const input = document.getElementById(`comment-input-${postId}`);
    if (input) {
        input.focus();
        input.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
};

window.showProfile = async (userId) => {
    const userRef = ref(db, "users/" + userId);
    const postsRef = ref(db, "posts");
    
    const [userSnapshot, postsSnapshot] = await Promise.all([
        get(userRef),
        get(postsRef)
    ]);
    
    const userData = userSnapshot.val();
    const posts = postsSnapshot.val() || {};
    
    // Calcular estadísticas del usuario
    const userPosts = Object.values(posts).filter(post => post.uid === userId);
    const totalPosts = userPosts.length;
    const totalLikes = userPosts.reduce((sum, post) => sum + (post.likesCount || post.likes || 0), 0);
    const totalComments = userPosts.reduce((sum, post) => sum + (post.comments ? Object.keys(post.comments).length : 0), 0);
    
    profileContent.innerHTML = `
        <div class="profile-header">
            <img src="${userData?.photo || 'https://via.placeholder.com/100'}" alt="${userData?.name || 'Usuario'}">
            <h2>${userData?.name || 'Usuario'}</h2>
        </div>
        <div class="profile-stats">
            <div class="stat">
                <div class="stat-value">${totalPosts}</div>
                <div class="stat-label">Publicaciones</div>
            </div>
            <div class="stat">
                <div class="stat-value">${totalLikes}</div>
                <div class="stat-label">Likes recibidos</div>
            </div>
            <div class="stat">
                <div class="stat-value">${totalComments}</div>
                <div class="stat-label">Comentarios</div>
            </div>
        </div>
        ${currentUser && userId === currentUser.uid ? `
            <button onclick="signOut()" style="background: #ff4757; width: 100%; margin-top: 15px;">
                <span>🚪</span> Cerrar sesión
            </button>
        ` : ''}
    `;
    
    profileModal.style.display = "flex";
};

// Mostrar perfil propio
profileBtn?.addEventListener('click', () => {
    if (currentUser) {
        showProfile(currentUser.uid);
    }
});

// Cerrar modales
closeProfile.onclick = () => {
    profileModal.style.display = "none";
};

closeSettings.onclick = () => {
    settingsModal.style.display = "none";
};

window.onclick = (event) => {
    if (event.target === profileModal) {
        profileModal.style.display = "none";
    }
    if (event.target === settingsModal) {
        settingsModal.style.display = "none";
    }
};

// Abrir ajustes
settingsBtn.onclick = () => {
    if (currentUser) {
        photoPreview.src = currentUser.photoURL || 'https://via.placeholder.com/100';
        displayNameInput.value = currentUser.displayName || '';
    }
    settingsModal.style.display = "flex";
};

// Vista previa de foto
window.previewPhoto = (input) => {
    if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = (e) => {
            photoPreview.src = e.target.result;
        };
        reader.readAsDataURL(input.files[0]);
    }
};

// Guardar cambios de perfil
window.saveProfileChanges = async () => {
    if (!currentUser) return;
    
    const newName = displayNameInput.value.trim();
    if (!newName) {
        alert("El nombre no puede estar vacío");
        return;
    }
    
    try {
        let photoURL = currentUser.photoURL;
        
        // Si hay una nueva foto
        if (photoInput.files && photoInput.files[0]) {
            const reader = new FileReader();
            reader.onload = async (e) => {
                const imageRef = storageRef(storage, `profilePhotos/${currentUser.uid}`);
                await uploadString(imageRef, e.target.result, 'data_url');
                photoURL = await getDownloadURL(imageRef);
                
                await updateProfile(currentUser, {
                    displayName: newName,
                    photoURL: photoURL
                });
                
                // Actualizar en la base de datos
                await set(ref(db, "users/" + currentUser.uid), {
                    name: newName,
                    photo: photoURL
                });
                
                alert("Perfil actualizado correctamente");
                settingsModal.style.display = "none";
                
                // Recargar la página para actualizar todas las publicaciones
                location.reload();
            };
            reader.readAsDataURL(photoInput.files[0]);
        } else {
            await updateProfile(currentUser, {
                displayName: newName
            });
            
            await set(ref(db, "users/" + currentUser.uid), {
                name: newName,
                photo: currentUser.photoURL
            });
            
            alert("Perfil actualizado correctamente");
            settingsModal.style.display = "none";
            
            // Recargar la página para actualizar todas las publicaciones
            location.reload();
        }
    } catch (error) {
        console.error("Error al actualizar perfil:", error);
        alert("Error al actualizar el perfil");
    }
};

// Función de cierre de sesión
window.signOut = async () => {
    try {
        await signOut(auth);
        profileModal.style.display = "none";
    } catch (error) {
        console.error("Error al cerrar sesión:", error);
    }
};
</script>
</body>
</html>
