<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yarep - Red Social</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

:root {
  --primary: #6366f1;
  --primary-dark: #4f46e5;
  --success: #10b981;
  --danger: #ef4444;
  --warning: #f59e0b;
  --dark-bg: #0f0f1a;
  --dark-card: #1a1a2e;
  --dark-border: #2d2d44;
  --light-bg: #f9fafb;
  --light-card: #ffffff;
  --light-border: #e5e7eb;
  --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Inter', sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
  padding: 2rem;
  gap: 1.5rem;
  transition: var(--transition);
  animation: fadeIn 0.5s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.container {
  max-width: 800px;
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 1.5rem;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  padding: 1rem;
  border-radius: 1rem;
  backdrop-filter: blur(10px);
}

.logo {
  font-size: 1.8rem;
  font-weight: 700;
  background: linear-gradient(135deg, var(--primary), var(--success));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: -0.5px;
}

textarea, input {
  padding: 0.875rem 1rem;
  border-radius: 0.75rem;
  border: 2px solid transparent;
  font-family: 'Inter', sans-serif;
  font-size: 0.95rem;
  transition: var(--transition);
  width: 100%;
}

textarea:focus, input:focus {
  outline: none;
  border-color: var(--primary);
  transform: translateY(-2px);
}

button {
  padding: 0.75rem 1.5rem;
  border: none;
  border-radius: 0.75rem;
  cursor: pointer;
  font-weight: 600;
  font-size: 0.95rem;
  transition: var(--transition);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
}

button:active {
  transform: scale(0.95);
}

button.primary {
  background: var(--primary);
  color: white;
}

button.primary:hover {
  background: var(--primary-dark);
  transform: translateY(-2px);
  box-shadow: 0 10px 20px -10px var(--primary);
}

button.outline {
  background: transparent;
  border: 2px solid var(--primary);
  color: var(--primary);
}

button.outline:hover {
  background: var(--primary);
  color: white;
}

.profile-section {
  display: flex;
  align-items: center;
  gap: 1rem;
  cursor: pointer;
  padding: 0.5rem 1rem;
  border-radius: 3rem;
  transition: var(--transition);
}

.profile-section:hover {
  background: rgba(99, 102, 241, 0.1);
}

.profile-img {
  width: 45px;
  height: 45px;
  border-radius: 50%;
  object-fit: cover;
  border: 3px solid var(--primary);
  transition: var(--transition);
}

.profile-section:hover .profile-img {
  transform: scale(1.05);
}

.profile-name {
  font-weight: 600;
  display: none;
}

@media (min-width: 640px) {
  .profile-name {
    display: inline;
  }
}

.posts-grid {
  display: flex;
  flex-direction: column;
  gap: 1.5rem;
  width: 100%;
}

.post {
  width: 100%;
  padding: 1.5rem;
  border-radius: 1.5rem;
  display: flex;
  flex-direction: column;
  gap: 1rem;
  animation: fadeIn 0.3s ease;
  transition: var(--transition);
  border: 2px solid transparent;
}

.post:hover {
  transform: translateY(-4px);
  box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
}

.post-header {
  display: flex;
  gap: 1rem;
  align-items: center;
  cursor: pointer;
  padding: 0.5rem;
  border-radius: 0.75rem;
  transition: var(--transition);
}

.post-header:hover {
  background: rgba(99, 102, 241, 0.1);
}

.post-header img {
  width: 45px;
  height: 45px;
  border-radius: 50%;
  border: 2px solid var(--primary);
  transition: var(--transition);
}

.post-header:hover img {
  transform: scale(1.05);
}

.post-content {
  font-size: 1rem;
  line-height: 1.5;
  padding: 0 0.5rem;
}

.post-actions {
  display: flex;
  gap: 1rem;
  align-items: center;
  padding: 0.5rem;
  border-top: 1px solid rgba(99, 102, 241, 0.2);
  border-bottom: 1px solid rgba(99, 102, 241, 0.2);
}

.like-btn {
  background: transparent;
  padding: 0.5rem 1rem;
  font-size: 1rem;
  border-radius: 2rem;
  border: 2px solid transparent;
}

.like-btn.liked {
  background: var(--danger);
  color: white;
  border-color: var(--danger);
}

.like-btn:not(.liked):hover {
  background: rgba(239, 68, 68, 0.1);
  border-color: var(--danger);
}

.comment-input {
  display: flex;
  gap: 0.5rem;
  align-items: center;
}

.comment-input input {
  flex: 1;
}

.comment-input button {
  padding: 0.75rem;
  border-radius: 0.75rem;
  background: var(--primary);
  color: white;
  min-width: 80px;
}

.comment-input button:hover {
  background: var(--primary-dark);
}

.comments-section {
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
  margin-top: 0.5rem;
  max-height: 300px;
  overflow-y: auto;
  padding: 0.5rem;
}

.comment {
  font-size: 0.9rem;
  padding: 0.75rem 1rem;
  border-radius: 1rem;
  animation: fadeIn 0.2s ease;
  transition: var(--transition);
}

.comment:hover {
  transform: translateX(4px);
}

.comment strong {
  color: var(--primary);
  font-weight: 600;
  cursor: pointer;
  transition: var(--transition);
}

.comment strong:hover {
  text-decoration: underline;
}

.profile-modal {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0, 0, 0, 0.7);
  backdrop-filter: blur(10px);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 1000;
  animation: fadeIn 0.3s ease;
}

.profile-card {
  width: 90%;
  max-width: 400px;
  padding: 2rem;
  border-radius: 2rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1.5rem;
  animation: slideUp 0.3s ease;
}

@keyframes slideUp {
  from { transform: translateY(50px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

.profile-card img {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  border: 4px solid var(--primary);
  object-fit: cover;
}

.profile-card h2 {
  font-size: 1.8rem;
  font-weight: 700;
}

.profile-card p {
  font-size: 1rem;
  opacity: 0.8;
}

.profile-stats {
  display: flex;
  gap: 2rem;
  margin: 1rem 0;
}

.stat {
  text-align: center;
}

.stat-number {
  font-size: 1.5rem;
  font-weight: 700;
  color: var(--primary);
}

.stat-label {
  font-size: 0.9rem;
  opacity: 0.7;
}

.close-btn {
  position: absolute;
  top: 1rem;
  right: 1rem;
  background: var(--danger);
  color: white;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.2rem;
  cursor: pointer;
  transition: var(--transition);
}

.close-btn:hover {
  transform: rotate(90deg);
}

/* Dark mode */
@media (prefers-color-scheme: dark) {
  body {
    background: linear-gradient(135deg, var(--dark-bg), #1a0f2e);
    color: #f0f0f0;
  }
  
  textarea, input {
    background: var(--dark-card);
    color: #f0f0f0;
    border-color: var(--dark-border);
  }
  
  .post {
    background: var(--dark-card);
    border-color: var(--dark-border);
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
  }
  
  .comment {
    background: rgba(99, 102, 241, 0.1);
  }
  
  .profile-card {
    background: var(--dark-card);
    border: 2px solid var(--dark-border);
  }
  
  .header {
    background: rgba(26, 26, 46, 0.7);
    border: 1px solid var(--dark-border);
  }
}

/* Light mode */
@media (prefers-color-scheme: light) {
  body {
    background: linear-gradient(135deg, var(--light-bg), #eef2ff);
    color: #1f2937;
  }
  
  textarea, input {
    background: var(--light-card);
    color: #1f2937;
    border-color: var(--light-border);
  }
  
  .post {
    background: var(--light-card);
    border-color: var(--light-border);
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
  }
  
  .comment {
    background: #f3f4f6;
  }
  
  .profile-card {
    background: var(--light-card);
    border: 2px solid var(--light-border);
  }
  
  .header {
    background: rgba(255, 255, 255, 0.7);
    border: 1px solid var(--light-border);
  }
}

.loading {
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 2rem;
}

.loading::after {
  content: '';
  width: 40px;
  height: 40px;
  border: 4px solid var(--primary);
  border-top-color: transparent;
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.hidden {
  display: none !important;
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <span class="logo">Yarep</span>
    <button id="loginBtn" class="primary">Iniciar sesión con Google</button>
    <div id="profileSection" class="profile-section hidden">
      <img id="profileImage" class="profile-img" src="" alt="Profile">
      <span id="profileName" class="profile-name"></span>
    </div>
  </div>

  <div id="userArea" class="hidden">
    <textarea id="postInput" placeholder="¿Qué estás pensando?"></textarea>
    <button id="postBtn" class="primary">Publicar</button>
  </div>

  <div id="posts" class="posts-grid"></div>
</div>

<div id="profileModal" class="profile-modal hidden">
  <div class="profile-card">
    <div class="close-btn" onclick="closeProfileModal()">✕</div>
    <img id="modalProfileImage" src="" alt="Profile">
    <h2 id="modalProfileName"></h2>
    <p id="modalProfileEmail"></p>
    <div class="profile-stats">
      <div class="stat">
        <div class="stat-number" id="modalPostsCount">0</div>
        <div class="stat-label">Publicaciones</div>
      </div>
      <div class="stat">
        <div class="stat-number" id="modalLikesCount">0</div>
        <div class="stat-label">Likes recibidos</div>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, setPersistence, browserLocalPersistence, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getDatabase, ref, set, push, onValue, update, get, query, orderByChild, equalTo } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBxOsWfP64cAUsMK6XPwfUcrEI6xQF_lc4",
  authDomain: "yarep-ydturl.firebaseapp.com",
  databaseURL: "https://yarep-ydturl-default-rtdb.firebaseio.com",
  projectId: "yarep-ydturl",
  storageBucket: "yarep-ydturl.firebasestorage.app",
  messagingSenderId: "765100698390",
  appId: "1:765100698390:web:7db4490c174dac46253e37"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);
const provider = new GoogleAuthProvider();

await setPersistence(auth, browserLocalPersistence);

// Elementos del DOM
const loginBtn = document.getElementById("loginBtn");
const userArea = document.getElementById("userArea");
const postBtn = document.getElementById("postBtn");
const postInput = document.getElementById("postInput");
const postsDiv = document.getElementById("posts");
const profileSection = document.getElementById("profileSection");
const profileImage = document.getElementById("profileImage");
const profileName = document.getElementById("profileName");
const profileModal = document.getElementById("profileModal");
const modalProfileImage = document.getElementById("modalProfileImage");
const modalProfileName = document.getElementById("modalProfileName");
const modalProfileEmail = document.getElementById("modalProfileEmail");
const modalPostsCount = document.getElementById("modalPostsCount");
const modalLikesCount = document.getElementById("modalLikesCount");

// Estado de likes del usuario actual
let currentUserLikes = new Set();

// Función para cerrar sesión
window.logout = async () => {
  await signOut(auth);
  location.reload();
};

// Función para abrir perfil
window.openProfile = (uid) => {
  showProfileModal(uid);
};

// Función para cerrar modal
window.closeProfileModal = () => {
  profileModal.classList.add('hidden');
};

// Mostrar perfil en modal
async function showProfileModal(uid) {
  const userSnapshot = await get(ref(db, `users/${uid}`));
  const userData = userSnapshot.val();
  
  if (!userData) return;
  
  modalProfileImage.src = userData.photo || 'https://via.placeholder.com/120';
  modalProfileName.textContent = userData.name || 'Usuario';
  modalProfileEmail.textContent = userData.email || '';
  
  // Contar publicaciones del usuario
  const postsSnapshot = await get(ref(db, 'posts'));
  const posts = postsSnapshot.val() || {};
  const userPosts = Object.values(posts).filter(post => post.uid === uid);
  modalPostsCount.textContent = userPosts.length;
  
  // Contar likes totales recibidos
  const totalLikes = userPosts.reduce((sum, post) => sum + (post.likes || 0), 0);
  modalLikesCount.textContent = totalLikes;
  
  profileModal.classList.remove('hidden');
}

// Login
loginBtn.onclick = async () => {
  try {
    await signInWithPopup(auth, provider);
  } catch (error) {
    console.error('Error al iniciar sesión:', error);
    alert('Error al iniciar sesión. Por favor, intenta de nuevo.');
  }
};

// Estado de autenticación
onAuthStateChanged(auth, async (user) => {
  if (user) {
    loginBtn.style.display = "none";
    profileSection.classList.remove("hidden");
    userArea.style.display = "block";
    
    profileImage.src = user.photoURL;
    profileName.textContent = user.displayName;
    
    // Guardar usuario en base de datos
    await set(ref(db, "users/" + user.uid), {
      name: user.displayName,
      photo: user.photoURL,
      email: user.email
    });
    
    // Cargar likes del usuario
    const likesSnapshot = await get(ref(db, `likes/${user.uid}`));
    if (likesSnapshot.exists()) {
      currentUserLikes = new Set(Object.keys(likesSnapshot.val()));
    }
    
    // Click en perfil para ver mi propio perfil
    profileSection.onclick = () => showProfileModal(user.uid);
  } else {
    loginBtn.style.display = "block";
    profileSection.classList.add("hidden");
    userArea.style.display = "none";
  }
});

// Publicar post
postBtn.onclick = () => {
  const user = auth.currentUser;
  if (!user || !postInput.value.trim()) return;
  
  const postRef = push(ref(db, "posts"));
  set(postRef, {
    uid: user.uid,
    name: user.displayName,
    photo: user.photoURL,
    message: postInput.value,
    likes: 0,
    likesCount: 0,
    comments: {},
    date: Date.now()
  });
  
  postInput.value = "";
};

// Escuchar posts
onValue(ref(db, "posts"), (snapshot) => {
  postsDiv.innerHTML = "";
  const data = snapshot.val();
  if (!data) return;
  
  Object.entries(data)
    .sort(([,a], [,b]) => (b.date || 0) - (a.date || 0))
    .forEach(([id, post]) => {
      const commentsHTML = post.comments ? Object.entries(post.comments)
        .map(([commentId, comment]) => `
          <div class="comment" key="${commentId}">
            <strong onclick="openProfile('${comment.uid}')">${comment.name}:</strong> 
            ${comment.text}
          </div>
        `).join("") : "";
      
      const user = auth.currentUser;
      const hasLiked = user && currentUserLikes.has(id);
      
      const postElement = document.createElement('div');
      postElement.className = 'post';
      postElement.innerHTML = `
        <div class="post-header" onclick="openProfile('${post.uid}')">
          <img src="${post.photo || 'https://via.placeholder.com/45'}" alt="${post.name}">
          <strong>${post.name}</strong>
        </div>
        <div class="post-content">${post.message}</div>
        <div class="post-actions">
          <button class="like-btn ${hasLiked ? 'liked' : ''}" onclick="toggleLike('${id}', this)">
            ❤️ <span class="likes-count">${post.likes || 0}</span>
          </button>
        </div>
        <div class="comment-input">
          <input type="text" placeholder="Escribe un comentario..." id="comment-${id}">
          <button onclick="commentPost('${id}')">Comentar</button>
        </div>
        <div class="comments-section">
          ${commentsHTML || '<p style="opacity:0.5; text-align:center;">No hay comentarios aún</p>'}
        </div>
      `;
      
      postsDiv.appendChild(postElement);
    });
});

// Función para dar/quitar like
window.toggleLike = async (postId, buttonElement) => {
  const user = auth.currentUser;
  if (!user) {
    alert('Debes iniciar sesión para dar like');
    return;
  }
  
  const postRef = ref(db, `posts/${postId}`);
  const likeRef = ref(db, `likes/${user.uid}/${postId}`);
  
  try {
    const postSnapshot = await get(postRef);
    const post = postSnapshot.val();
    
    if (!post) return;
    
    if (currentUserLikes.has(postId)) {
      // Quitar like
      await update(postRef, { likes: (post.likes || 0) - 1 });
      await set(likeRef, null);
      currentUserLikes.delete(postId);
      buttonElement.classList.remove('liked');
    } else {
      // Dar like
      await update(postRef, { likes: (post.likes || 0) + 1 });
      await set(likeRef, true);
      currentUserLikes.add(postId);
      buttonElement.classList.add('liked');
    }
    
    // Actualizar contador
    const likesCountSpan = buttonElement.querySelector('.likes-count');
    const newCount = (post.likes || 0) + (currentUserLikes.has(postId) ? 1 : -1);
    likesCountSpan.textContent = Math.max(0, newCount);
    
  } catch (error) {
    console.error('Error al actualizar like:', error);
    alert('Error al procesar el like');
  }
};

// Función para comentar
window.commentPost = async (postId) => {
  const user = auth.currentUser;
  const input = document.getElementById(`comment-${postId}`);
  
  if (!user) {
    alert('Debes iniciar sesión para comentar');
    return;
  }
  
  if (!input.value.trim()) return;
  
  try {
    const commentRef = push(ref(db, `posts/${postId}/comments`));
    await set(commentRef, {
      uid: user.uid,
      name: user.displayName,
      text: input.value,
      date: Date.now()
    });
    
    input.value = "";
  } catch (error) {
    console.error('Error al comentar:', error);
    alert('Error al publicar el comentario');
  }
};

// Cerrar modal al hacer clic fuera
profileModal.addEventListener('click', (e) => {
  if (e.target === profileModal) {
    closeProfileModal();
  }
});
</script>
</body>
</html>
