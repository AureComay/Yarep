<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yarep - Red Social</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: 'Inter', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 30px 20px;
    gap: 25px;
    animation: fadeIn 0.5s ease;
    transition: background-color 0.3s, color 0.3s;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

.container {
    max-width: 600px;
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 25px;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    margin-bottom: 10px;
}

.logo {
    font-size: 28px;
    font-weight: 700;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

textarea, input {
    padding: 12px 16px;
    border-radius: 12px;
    border: 2px solid transparent;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    transition: all 0.3s ease;
    width: 100%;
    outline: none;
}

textarea {
    min-height: 100px;
    resize: vertical;
}

button {
    padding: 10px 20px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    font-weight: 600;
    font-size: 14px;
    transition: all 0.3s ease;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 20px rgba(0,0,0,0.1);
}

button:active {
    transform: translateY(0);
}

#loginBtn {
    background: white;
    color: #333;
    border: 2px solid #e0e0e0;
}

#userArea {
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(10px);
    border-radius: 16px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 15px;
    border: 1px solid rgba(255,255,255,0.2);
}

.post {
    width: 100%;
    padding: 20px;
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    gap: 15px;
    animation: fadeIn 0.3s ease;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.2);
}

.post:hover {
    transform: translateY(-2px);
    box-shadow: 0 15px 30px rgba(0,0,0,0.2);
}

.post-header {
    display: flex;
    gap: 12px;
    align-items: center;
    cursor: pointer;
    padding: 5px;
    border-radius: 30px;
    transition: background-color 0.3s ease;
}

.post-header:hover {
    background: rgba(255,255,255,0.1);
}

.post-header img {
    width: 45px;
    height: 45px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid #667eea;
}

.post-message {
    font-size: 15px;
    line-height: 1.6;
    padding: 10px 0;
}

.post-actions {
    display: flex;
    gap: 15px;
    border-top: 1px solid rgba(255,255,255,0.1);
    padding-top: 15px;
}

.action-btn {
    background: transparent;
    color: inherit;
    padding: 8px 16px;
    border-radius: 30px;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    border: 1px solid rgba(255,255,255,0.2);
}

.action-btn:hover {
    background: rgba(255,255,255,0.1);
    transform: none;
    box-shadow: none;
}

.action-btn.liked {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    border-color: transparent;
}

.comments-section {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 10px;
}

.comment-input {
    display: flex;
    gap: 10px;
    align-items: center;
}

.comment-input input {
    flex: 1;
    padding: 10px 14px;
    font-size: 13px;
}

.comment {
    font-size: 13px;
    padding: 10px 14px;
    border-radius: 12px;
    background: rgba(255,255,255,0.05);
    line-height: 1.5;
}

.comment strong {
    color: #667eea;
    font-weight: 600;
}

.profile-modal {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0,0,0,0.8);
    backdrop-filter: blur(10px);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 1000;
    animation: fadeIn 0.3s ease;
}

.profile-content {
    background: rgba(30,30,40,0.95);
    border-radius: 24px;
    padding: 30px;
    max-width: 400px;
    width: 90%;
    position: relative;
    border: 1px solid rgba(255,255,255,0.2);
}

.close-btn {
    position: absolute;
    top: 15px;
    right: 15px;
    background: rgba(255,255,255,0.1);
    border: none;
    font-size: 20px;
    cursor: pointer;
    color: white;
    width: 35px;
    height: 35px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
}

.close-btn:hover {
    background: rgba(255,255,255,0.2);
}

.profile-header {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
    margin-bottom: 25px;
}

.profile-header img {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    border: 3px solid #667eea;
}

.profile-stats {
    display: flex;
    justify-content: space-around;
    width: 100%;
    margin: 20px 0;
    padding: 15px 0;
    border-top: 1px solid rgba(255,255,255,0.1);
    border-bottom: 1px solid rgba(255,255,255,0.1);
}

.stat {
    text-align: center;
}

.stat-value {
    font-size: 20px;
    font-weight: 700;
    color: #667eea;
}

.stat-label {
    font-size: 12px;
    opacity: 0.7;
}

.user-profile-btn {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.2);
    color: inherit;
    padding: 8px 16px;
    border-radius: 30px;
    font-size: 14px;
}

.user-profile-btn:hover {
    background: rgba(255,255,255,0.1);
}

@media (prefers-color-scheme: dark) {
    body {
        background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
        color: #ffffff;
    }
    
    textarea, input {
        background: rgba(255,255,255,0.05);
        color: #ffffff;
        border-color: rgba(255,255,255,0.1);
    }
    
    textarea:focus, input:focus {
        border-color: #667eea;
    }
    
    .post {
        background: rgba(255,255,255,0.03);
    }
}

@media (prefers-color-scheme: light) {
    body {
        background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        color: #333333;
    }
    
    textarea, input {
        background: white;
        color: #333333;
        border-color: #e0e0e0;
    }
    
    textarea:focus, input:focus {
        border-color: #667eea;
    }
    
    .post {
        background: rgba(255,255,255,0.7);
        border-color: rgba(0,0,0,0.1);
    }
    
    .comment {
        background: rgba(0,0,0,0.03);
    }
}
</style>
</head>
<body>
<div class="container">
    <div class="header">
        <span class="logo">Yarep</span>
        <button id="loginBtn" class="user-profile-btn">
            <span>👤</span> Iniciar sesión
        </button>
    </div>

    <div id="userArea" style="display:none;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h3>Crear publicación</h3>
            <button id="profileBtn" class="user-profile-btn">
                <span>👤</span> Mi perfil
            </button>
        </div>
        <textarea id="postInput" placeholder="¿Qué estás pensando?"></textarea>
        <button id="postBtn">Publicar</button>
    </div>

    <div id="posts"></div>
</div>

<!-- Modal de perfil -->
<div id="profileModal" class="profile-modal">
    <div class="profile-content">
        <button class="close-btn" id="closeProfile">&times;</button>
        <div id="profileContent"></div>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, setPersistence, browserLocalPersistence, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getDatabase, ref, set, push, onValue, update, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyBxOsWfP64cAUsMK6XPwfUcrEI6xQF_lc4",
    authDomain: "yarep-ydturl.firebaseapp.com",
    databaseURL: "https://yarep-ydturl-default-rtdb.firebaseio.com",
    projectId: "yarep-ydturl",
    storageBucket: "yarep-ydturl.firebasestorage.app",
    messagingSenderId: "765100698390",
    appId: "1:765100698390:web:7db4490c174dac46253e37"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);
const provider = new GoogleAuthProvider();

await setPersistence(auth, browserLocalPersistence);

const loginBtn = document.getElementById("loginBtn");
const userArea = document.getElementById("userArea");
const postBtn = document.getElementById("postBtn");
const postInput = document.getElementById("postInput");
const postsDiv = document.getElementById("posts");
const profileBtn = document.getElementById("profileBtn");
const profileModal = document.getElementById("profileModal");
const profileContent = document.getElementById("profileContent");
const closeProfile = document.getElementById("closeProfile");

let currentUser = null;
let userLikes = {};

// Cargar likes del usuario
async function loadUserLikes(userId) {
    const likesRef = ref(db, `userLikes/${userId}`);
    const snapshot = await get(likesRef);
    if (snapshot.exists()) {
        userLikes = snapshot.val() || {};
    }
}

// Guardar like
async function saveUserLike(userId, postId) {
    userLikes[postId] = true;
    await set(ref(db, `userLikes/${userId}`), userLikes);
}

// Quitar like
async function removeUserLike(userId, postId) {
    delete userLikes[postId];
    await set(ref(db, `userLikes/${userId}`), userLikes);
}

loginBtn.onclick = async () => {
    try {
        await signInWithPopup(auth, provider);
    } catch (error) {
        console.error("Error al iniciar sesión:", error);
    }
};

onAuthStateChanged(auth, async user => {
    if (user) {
        currentUser = user;
        loginBtn.innerHTML = '<span>👤</span> ' + user.displayName.split(' ')[0];
        userArea.style.display = "block";
        
        await loadUserLikes(user.uid);
        
        set(ref(db, "users/" + user.uid), {
            name: user.displayName,
            photo: user.photoURL,
            email: user.email
        });
    } else {
        currentUser = null;
        loginBtn.innerHTML = '<span>👤</span> Iniciar sesión';
        userArea.style.display = "none";
        userLikes = {};
    }
});

postBtn.onclick = () => {
    const user = auth.currentUser;
    if (!user || !postInput.value.trim()) return;

    push(ref(db, "posts"), {
        uid: user.uid,
        name: user.displayName,
        photo: user.photoURL,
        message: postInput.value,
        likes: 0,
        likesCount: 0,
        comments: {},
        date: Date.now()
    });

    postInput.value = "";
};

onValue(ref(db, "posts"), snapshot => {
    postsDiv.innerHTML = "";
    const data = snapshot.val();
    if (!data) return;

    Object.entries(data).reverse().forEach(([id, post]) => {
        const commentsHTML = post.comments ? Object.entries(post.comments).map(([commentId, comment]) => `
            <div class="comment" key="${commentId}">
                <strong>${comment.name}:</strong> ${comment.text}
            </div>
        `).join("") : "";

        const hasLiked = currentUser && userLikes[id];
        const likesCount = post.likesCount || post.likes || 0;

        postsDiv.innerHTML += `
        <div class="post" data-post-id="${id}">
            <div class="post-header" onclick="showProfile('${post.uid}')">
                <img src="${post.photo}" alt="${post.name}">
                <strong>${post.name}</strong>
            </div>
            <div class="post-message">${post.message}</div>
            <div class="post-actions">
                <button class="action-btn ${hasLiked ? 'liked' : ''}" onclick="handleLike('${id}')">
                    <span>❤️</span> ${likesCount}
                </button>
                <button class="action-btn" onclick="focusComment('${id}')">
                    <span>💬</span> Comentar
                </button>
            </div>
            <div class="comments-section" id="comments-${id}">
                <div class="comment-input">
                    <input type="text" placeholder="Escribe un comentario..." id="comment-input-${id}" onkeydown="if(event.key==='Enter')handleComment('${id}', this)">
                    <button onclick="handleComment('${id}', document.getElementById('comment-input-${id}'))">Enviar</button>
                </div>
                <div class="comments-list">
                    ${commentsHTML}
                </div>
            </div>
        </div>
        `;
    });
});

window.handleLike = async (postId) => {
    if (!currentUser) {
        alert("Debes iniciar sesión para dar like");
        return;
    }

    const postRef = ref(db, "posts/" + postId);
    const snapshot = await get(postRef);
    const post = snapshot.val();
    
    if (!post) return;

    const hasLiked = userLikes[postId];
    const currentLikes = post.likesCount || post.likes || 0;

    if (hasLiked) {
        // Quitar like
        await update(postRef, {
            likesCount: currentLikes - 1
        });
        await removeUserLike(currentUser.uid, postId);
    } else {
        // Dar like
        await update(postRef, {
            likesCount: currentLikes + 1
        });
        await saveUserLike(currentUser.uid, postId);
    }
};

window.handleComment = async (postId, input) => {
    const user = auth.currentUser;
    if (!user || !input.value.trim()) return;

    await push(ref(db, "posts/" + postId + "/comments"), {
        name: user.displayName,
        text: input.value,
        uid: user.uid,
        date: Date.now()
    });

    input.value = "";
};

window.focusComment = (postId) => {
    const input = document.getElementById(`comment-input-${postId}`);
    if (input) {
        input.focus();
        input.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
};

window.showProfile = async (userId) => {
    const userRef = ref(db, "users/" + userId);
    const postsRef = ref(db, "posts");
    
    const [userSnapshot, postsSnapshot] = await Promise.all([
        get(userRef),
        get(postsRef)
    ]);
    
    const userData = userSnapshot.val();
    const posts = postsSnapshot.val() || {};
    
    // Calcular estadísticas del usuario
    const userPosts = Object.values(posts).filter(post => post.uid === userId);
    const totalPosts = userPosts.length;
    const totalLikes = userPosts.reduce((sum, post) => sum + (post.likesCount || post.likes || 0), 0);
    const totalComments = userPosts.reduce((sum, post) => sum + (post.comments ? Object.keys(post.comments).length : 0), 0);
    
    profileContent.innerHTML = `
        <div class="profile-header">
            <img src="${userData?.photo || 'https://via.placeholder.com/100'}" alt="${userData?.name || 'Usuario'}">
            <h2>${userData?.name || 'Usuario'}</h2>
            <p style="opacity: 0.7;">${userData?.email || ''}</p>
        </div>
        <div class="profile-stats">
            <div class="stat">
                <div class="stat-value">${totalPosts}</div>
                <div class="stat-label">Publicaciones</div>
            </div>
            <div class="stat">
                <div class="stat-value">${totalLikes}</div>
                <div class="stat-label">Likes recibidos</div>
            </div>
            <div class="stat">
                <div class="stat-value">${totalComments}</div>
                <div class="stat-label">Comentarios</div>
            </div>
        </div>
        ${currentUser && userId === currentUser.uid ? `
            <button onclick="signOut()" style="background: #ff4757; width: 100%; margin-top: 15px;">
                <span>🚪</span> Cerrar sesión
            </button>
        ` : ''}
    `;
    
    profileModal.style.display = "flex";
};

// Mostrar perfil propio
profileBtn?.addEventListener('click', () => {
    if (currentUser) {
        showProfile(currentUser.uid);
    }
});

// Cerrar modal
closeProfile.onclick = () => {
    profileModal.style.display = "none";
};

window.onclick = (event) => {
    if (event.target === profileModal) {
        profileModal.style.display = "none";
    }
};

// Función de cierre de sesión
window.signOut = async () => {
    try {
        await signOut(auth);
        profileModal.style.display = "none";
    } catch (error) {
        console.error("Error al cerrar sesión:", error);
    }
};

// Inicializar eventos de like y comentario desde el HTML
window.likePost = null; // Eliminar función anterior
window.commentPost = null; // Eliminar función anterior
</script>
</body>
</html>
