<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Yarep</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');
*{box-sizing:border-box;margin:0}
body{
font-family:'Poppins',sans-serif;
display:flex;
flex-direction:column;
align-items:center;
min-height:100vh;
padding:30px;
gap:20px;
animation:f .5s ease;
transition:.4s
}
@keyframes f{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

textarea,input{
padding:10px;
border-radius:10px;
border:none;
font-family:'Poppins',sans-serif;
}

button{
padding:8px 14px;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:600;
}

.post{
width:350px;
padding:14px;
border-radius:16px;
display:flex;
flex-direction:column;
gap:10px;
animation:f .3s ease;
}

.post-header{
display:flex;
gap:10px;
align-items:center;
}

.post-header img{
width:45px;
height:45px;
border-radius:50%;
}

.comments{
display:flex;
flex-direction:column;
gap:6px;
margin-top:6px;
}

.comment{
font-size:13px;
padding:6px;
border-radius:8px;
}

@media(prefers-color-scheme:dark){
body{background:linear-gradient(135deg,#0a0a0a,#1a001f);color:#e5ccff}
textarea,input{background:#15001f;color:#e5ccff;border:1px solid #c084fc}
button{background:#c084fc;color:#15001f}
.post{background:rgba(40,0,60,.25);border:2px solid #c084fc}
.comment{background:#15001f}
}

@media(prefers-color-scheme:light){
body{background:linear-gradient(135deg,#330a00,#662000);color:#ffd8a6}
textarea,input{background:#4d1a00;color:#ffd8a6;border:1px solid #ff8c00}
button{background:#ff8c00;color:#4d1a00}
.post{background:rgba(60,20,0,.2);border:2px solid #ff8c00}
.comment{background:#4d1a00}
}
</style>
</head>
<body>

<button id="loginBtn">Iniciar sesión con Google</button>

<div id="userArea" style="display:none;">
<textarea id="postInput" placeholder="Escribe algo..."></textarea>
<button id="postBtn">Publicar</button>
</div>

<div id="posts"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getDatabase, ref, set, push, onValue, update } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBxOsWfP64cAUsMK6XPwfUcrEI6xQF_lc4",
  authDomain: "yarep-ydturl.firebaseapp.com",
  databaseURL: "https://yarep-ydturl-default-rtdb.firebaseio.com",
  projectId: "yarep-ydturl",
  storageBucket: "yarep-ydturl.firebasestorage.app",
  messagingSenderId: "765100698390",
  appId: "1:765100698390:web:7db4490c174dac46253e37"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);
const provider = new GoogleAuthProvider();

await setPersistence(auth, browserLocalPersistence);

const loginBtn = document.getElementById("loginBtn");
const userArea = document.getElementById("userArea");
const postBtn = document.getElementById("postBtn");
const postInput = document.getElementById("postInput");
const postsDiv = document.getElementById("posts");

loginBtn.onclick = async () => {
  await signInWithPopup(auth, provider);
};

onAuthStateChanged(auth, user => {
  if(user){
    loginBtn.style.display = "none";
    userArea.style.display = "block";

    set(ref(db, "users/" + user.uid), {
      name: user.displayName,
      photo: user.photoURL
    });
  }
});

postBtn.onclick = () => {
  const user = auth.currentUser;
  if(!user || !postInput.value.trim()) return;

  push(ref(db, "posts"), {
    uid:user.uid,
    name:user.displayName,
    photo:user.photoURL,
    message:postInput.value,
    likes:0,
    comments:{},
    date:Date.now()
  });

  postInput.value="";
};

onValue(ref(db,"posts"), snapshot=>{
  postsDiv.innerHTML="";
  const data=snapshot.val();
  if(!data) return;

  Object.entries(data).reverse().forEach(([id,post])=>{
    const commentsHTML = post.comments ? Object.values(post.comments).map(c=>`
      <div class="comment"><strong>${c.name}:</strong> ${c.text}</div>
    `).join("") : "";

    postsDiv.innerHTML+=`
    <div class="post">
      <div class="post-header">
        <img src="${post.photo}">
        <strong>${post.name}</strong>
      </div>
      <div>${post.message}</div>
      <button onclick="likePost('${id}',${post.likes||0})">❤️ ${post.likes||0}</button>
      <div>
        <input placeholder="Comentar..." onkeydown="if(event.key==='Enter')commentPost('${id}',this)">
      </div>
      <div class="comments">${commentsHTML}</div>
    </div>
    `;
  });
});

window.likePost=(id,currentLikes)=>{
  update(ref(db,"posts/"+id),{
    likes:(currentLikes||0)+1
  });
};

window.commentPost=(id,input)=>{
  const user=auth.currentUser;
  if(!user || !input.value.trim()) return;

  push(ref(db,"posts/"+id+"/comments"),{
    name:user.displayName,
    text:input.value
  });

  input.value="";
};
</script>

</body>
</html>
